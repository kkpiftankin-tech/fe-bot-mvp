    vessel: "Морское судно (надводное)"
    aircraft: "Воздушное судно или БПЛА"
    vehicle: "Наземное транспортное средство"
    event: "Дискретное событие в системе (тактическое, системное)"
    session: "Пользовательская сессия диалога или веб-сессия"
    transaction: "Финансовая или системная транзакция"
    user: "Пользователь системы"
    customer: "Клиент / потребитель"
    product: "Товар или услуга"
    device: "Аппаратное устройство / IoT-узел"
    account: "Учётная запись или финансовый счёт"
    zone: "Тактическая зона, географическая область"
    environment: "Внешняя среда (погода, гидрология, геомагнетизм)"
  synonyms:
    # русскоязычные
    трек: track
    цель: track
    "сопровождаемая цель": track
    сенсор: sensor
    датчик: sensor
    судно: vessel
    корабль: vessel
    "надводный объект": vessel
    самолёт: aircraft
    бпла: aircraft
    вертолёт: aircraft
    транспорт: vehicle
    автомобиль: vehicle
    событие: event
    сессия: session
    транзакция: transaction
    пользователь: user
    клиент: customer
    товар: product
    устройство: device
    аккаунт: account
    зона: zone
    район: zone
    среда: environment
    # английские синонимы
    target: track
    contact: track
    radar_target: track
    ship: vessel
    surface: vessel
    plane: aircraft
    drone: aircraft
    uav: aircraft
    car: vehicle
    ground_vehicle: vehicle
    log_event: event
    alert: event
    web_session: session
    iot_device: device
    geo_zone: zone

# ---------------------------------------------------------------------------
# phase — фаза workflow в LangGraph FE-Bot.
# Canonical values: Phase(StrEnum) в schemas/rag/ontology.py (10 значений).
# Включает nlu и analytics, которых нет в docs/04-domain/value-objects.md,
# но они зафиксированы в Phase(StrEnum) и rag-overview.
# ---------------------------------------------------------------------------
phase:
  values:
    - nlu
    - task_discovery
    - data_profiling
    - domain_context
    - feature_synthesis
    - validation
    - data_generation
    - model_selection
    - export
    - analytics
  descriptions:
    nlu: "Парсинг входного сообщения пользователя в intent + entities"
    task_discovery: "Определение ML-задачи, target, классов, метрик"
    data_profiling: "Сбор профиля данных: поля, объём, распределения"
    domain_context: "Извлечение доменного контекста через RAG"
    feature_synthesis: "Генерация и критика кандидатов признаков"
    validation: "Детерминированная валидация признаков и данных"
    data_generation: "Формирование GenerationSpec и синтетического датасета"
    model_selection: "Ранжирование моделей, формирование training config"
    export: "Сборка и экспорт воспроизводимого ML-pipeline"
    analytics: "Дашборды качества, метрики, observability"

# ---------------------------------------------------------------------------
# agent_targets — допустимые имена агентов из AGENTS.md.
# PascalCase — имена Python-классов. Порядок соответствует реестру AGENTS.md.
# ---------------------------------------------------------------------------
agent_targets:
  values:
    - SessionAgent
    - NLUAgent
    - RAGRetrievalAgent
    - DialogueOrchestratorAgent
    - ContextMemoryAgent
    - TaskDiscoveryAgent
    - DataProfilingAgent
    - DomainContextAgent
    - FeatureSynthesisAgent
    - FeatureCriticAgent
    - MulticollinearityAgent
    - DataGenerationSpecAgent
    - ModelSelectionAgent
    - ExportAgent
    - FeedbackAgent
    - AuditAgent
  descriptions:
    SessionAgent: "Создание / восстановление сессии и ContextMemory"
    NLUAgent: "Парсинг сообщения пользователя в intent + entities"
    RAGRetrievalAgent: "Извлечение релевантного контекста по metadata-фильтрам"
    DialogueOrchestratorAgent: "Маршрутизация переходов между фазами (LangGraph)"
    ContextMemoryAgent: "Поддержание типизированного состояния диалога"
    TaskDiscoveryAgent: "Определение ML-задачи, target, классов"
    DataProfilingAgent: "Сбор профиля данных (поля, объём, распределение)"
    DomainContextAgent: "Извлечение критичных доменных факторов"
    FeatureSynthesisAgent: "Генерация кандидатов признаков"
    FeatureCriticAgent: "Валидация кандидатов признаков по правилам"
    MulticollinearityAgent: "Проверка корреляций / VIF между признаками"
    DataGenerationSpecAgent: "Формирование GenerationSpec для синтетического датасета"
    ModelSelectionAgent: "Ранжирование моделей + формирование training config"
    ExportAgent: "Сборка пакета артефактов + manifest"
    FeedbackAgent: "Обработка пользовательских подтверждений и изменений"
    AuditAgent: "Запись событий и решений в audit trail"

# ---------------------------------------------------------------------------
# doc_type — типы RAG-карточек, допустимые в SETUP-05 (MVP-scope).
# Canonical values: DocType(StrEnum) в schemas/rag/ontology.py.
# ontology_card, domain_profile, model_recommendation_card, glossary_term,
# example_card, bad_example_card — out of scope MVP (defined in schema but
# not generated in SETUP-05).
# ---------------------------------------------------------------------------
doc_type:
  values:
    - schema_card
    - task_card
    - analytics_card
    - field_definition_card
    - feature_pattern_card
    - validation_rule_card
    - question_template_card
  out_of_scope_mvp:
    - ontology_card
    - domain_profile
    - model_recommendation_card
    - glossary_term
    - example_card
    - bad_example_card
  descriptions:
    schema_card: "Описание структуры данных, сущностей, полей, источников"
    task_card: "Описание ML-задачи: target, классы, метрики, модели"
    analytics_card: "Feature-store таблицы, агрегаты, аналитические признаки"
    field_definition_card: "Подробное описание одного поля: синонимы, единицы, диапазоны"
    feature_pattern_card: "Шаблон признака: формула, входы, evidence"
    validation_rule_card: "Правило проверки данных или признаков"
    question_template_card: "Шаблон уточняющего вопроса per-missing-slot"

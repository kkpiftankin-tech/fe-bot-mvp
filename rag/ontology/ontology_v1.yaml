entity_type:
  values:
    - track
    - sensor
    - vessel
    - aircraft
    - vehicle
    - event
    - session
    - transaction
    - user
    - customer
    - product
    - device
    - account
    - zone
    - environment
  descriptions:
    track: "Трек (сопровождаемый объект) в системе управления"

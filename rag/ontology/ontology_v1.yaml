# Ontology v1 for FE-Bot RAG cards (SETUP-05).
# Loaded by src/fe_bot/setup/rag_card_generation/ontology_mapper.py.
# Values are canonical; synonyms map to canonical via lower-cased keys.
# MVP scope — расширения проходят через bump до ontology_v2 + миграцию RAGCardMetadata.
#
# Source of truth: docs/06-rag/ontology.md + schemas/rag/ontology.py.
# Synonyms are case-insensitive; OntologyMapper must apply .lower().strip() before lookup.

ontology_version: "ontology_v1"

# ---------------------------------------------------------------------------
# domain — физический / прикладной домен задачи.
# Canonical values соответствуют Domain(StrEnum) в schemas/rag/ontology.py.
# ---------------------------------------------------------------------------
domain:
  values:
    - naval
    - air
    - ground
    - cyber
    - analytical
    - custom
  descriptions:
    naval: "Морская тематика: radar, sonar, AIS, надводные и подводные объекты"
    air: "Воздушный домен: воздушное пространство, авиация, БПЛА"
    ground: "Наземный домен: бронетехника, транспорт, наземные объекты"
    cyber: "Кибер-домен: сетевые события, кибератаки, аномалии"
    analytical: "Общая аналитика без жёсткой физической привязки"
    custom: "Открытая категория для пользовательских доменов; карточка помечается review_required"
  synonyms:
    # русскоязычные
    морской: naval
    морская: naval
    флот: naval
    "военно-морской": naval
    воздушный: air
    авиация: air
    авиационный: air
    наземный: ground
    наземная: ground
    сухопутный: ground
    кибер: cyber
    кибербезопасность: cyber
    аналитика: analytical
    аналитический: analytical
    # английские синонимы / допустимые написания
    maritime: naval
    sea: naval
    undersea: naval
    aerospace: air
    aviation: air
    drone: air
    uav: air
    land: ground
    terrestrial: ground
    armored: ground
    cybersecurity: cyber
    network: cyber
    general: analytical
    generic: analytical

# ---------------------------------------------------------------------------
# task_type — тип ML-задачи.
# Canonical values: TaskType(StrEnum) в schemas/rag/ontology.py.
# ---------------------------------------------------------------------------
task_type:
  values:
    - classification
    - regression
    - clustering
    - anomaly_detection
    - ranking
    - trajectory_forecasting
    - object_detection
  descriptions:
    classification: "Задача классификации: бинарная или многоклассовая"
    regression: "Задача регрессии: предсказание непрерывной величины"
    clustering: "Кластеризация: разбиение на группы без меток"
    anomaly_detection: "Обнаружение аномалий, выбросов, нештатных ситуаций"
    ranking: "Ранжирование объектов по релевантности или приоритету"
    trajectory_forecasting: "Прогноз траектории движущегося объекта"
    object_detection: "Обнаружение и локализация объектов"
  synonyms:
    # русскоязычные
    классификация: classification
    классификатор: classification
    регрессия: regression
    прогноз: trajectory_forecasting
    прогнозирование: trajectory_forecasting
    кластеризация: clustering
    аномалия: anomaly_detection
    "обнаружение аномалий": anomaly_detection
    ранжирование: ranking
    "обнаружение объектов": object_detection
    детекция: object_detection
    # английские синонимы
    detect: anomaly_detection
    detection: anomaly_detection
    forecast: trajectory_forecasting
    forecasting: trajectory_forecasting
    time_series_forecast: trajectory_forecasting
    rank: ranking
    reranking: ranking
    multiclass: classification
    binary: classification
    regression_task: regression

# ---------------------------------------------------------------------------
# data_source — тип / источник данных.
# Canonical values: DataSource(StrEnum) в schemas/rag/ontology.py.
# Значения чувствительны к регистру после нормализации (нижний регистр);
# исходные enum-строки такие: "radar", "AIS", "ESM", "EO_IR".
# ---------------------------------------------------------------------------
data_source:
  values:
    - radar
    - sonar
    - AIS
    - ESM
    - EO_IR
    - satellite
    - tracks_fused
    - external_conditions
    - tactical_objects
    - SQL
    - CSV
    - JSON
    - custom
  descriptions:
    radar: "Данные радиолокационных станций: дальность, курс, скорость, RCS"
    sonar: "Гидроакустические данные: подводные объекты, акустический профиль"
    AIS: "Автоматическая идентификационная система судов (морской AIS)"
    ESM: "Радиоэлектронная разведка (Electronic Support Measures)"
    EO_IR: "Электронно-оптические и инфракрасные сенсоры"
    satellite: "Спутниковые данные: изображения, радар с орбиты"
    tracks_fused: "Слитые треки из нескольких источников"
    external_conditions: "Внешние условия: погода, морская обстановка, гидрология"
    tactical_objects: "Тактические объекты из БД / COP-систем"
    SQL: "Реляционные базы данных (SQL-источники)"
    CSV: "Табличные файлы CSV"
    JSON: "Структурированные данные в формате JSON"
    custom: "Пользовательский источник данных; требует review"
  synonyms:
    # русскоязычные
    радар: radar
    рлс: radar
    гидроакустика: sonar
    "акустический сенсор": sonar
    аис: AIS
    "автоматическая идентификация": AIS
    эсм: ESM
    "эо/ик": EO_IR
    спутник: satellite
    спутниковый: satellite
    "слитые треки": tracks_fused
    "фьюжн треков": tracks_fused
    "внешние условия": external_conditions
    погода: external_conditions
    "тактические объекты": tactical_objects
    база: SQL
    таблица: CSV
    # английские синонимы
    tabular: CSV
    database: SQL
    relational: SQL
    json_api: JSON
    rest_api: JSON
    fused_tracks: tracks_fused
    fusion: tracks_fused
    eo: EO_IR
    ir: EO_IR
    electro_optical: EO_IR
    electronic_support: ESM
    ais_track: AIS

# ---------------------------------------------------------------------------

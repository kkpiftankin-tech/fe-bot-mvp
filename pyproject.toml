[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fe-bot"
version = "0.0.1"
description = "Feature Engineering & Data Generation Multi-Agent Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "FE-Bot team" }]
license = { text = "Proprietary" }

dependencies = [
  "fastapi>=0.113,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "langgraph>=0.2,<1.0",
  "langchain>=0.2,<1.0",
  "langchain-community>=0.2,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "httpx>=0.27,<1.0",
  "typing-extensions>=4.12,<5.0",
  "pyyaml>=6.0,<7.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "respx>=0.21,<1.0",
  "types-PyYAML>=6.0,<7.0",
]
rag = [
  "qdrant-client>=1.10,<2.0",
  "sentence-transformers>=3.0,<4.0",
]
data = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"
markers = [
  "unit: pure functions and schema checks",
  "component: a single agent or service with fakes",
  "integration: FastAPI + LangGraph + RAG + LLM mock",
  "e2e: full happy path",
  "rag_eval: retrieval quality cases",
  "prompt_eval: prompt → schema-valid JSON cases",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "validators", "schemas"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008: Depends()/Path()/Query() в default args — стандартный FastAPI-идиом.
"src/fe_bot/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "schemas", "validators"]
